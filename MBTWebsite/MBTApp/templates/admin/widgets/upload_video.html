{% load i18n static %}
<div class="mbt-upload mbt-upload--video" data-mbt-dropzone>
  <div class="mbt-upload-preview">
    <video src="{{ widget.current_url|default:'' }}" class="mbt-upload-video" controls muted preload="metadata"{% if not widget.current_url %} hidden{% endif %}></video>
    <span class="mbt-upload-empty"{% if widget.current_url %} hidden{% endif %}>Brak filmu</span>
  </div>
  <div class="mbt-upload-controls">
    <div class="mbt-upload-actions">
      <label class="mbt-upload-btn">
        Wybierz film…
        <input type="file" name="{{ widget.file_name }}" accept="video/mp4,video/webm,video/*" class="mbt-upload-file" data-preview="1">
      </label>
      <button type="button" class="mbt-upload-clear" data-mbt-clear{% if not widget.current_url %} hidden{% endif %}>Usuń</button>
    </div>
    <span class="mbt-upload-hint">MP4 lub WebM. Możesz też przeciągnąć plik tutaj albo wkleić adres URL:</span>
    <input type="text" name="{{ widget.name }}" value="{{ widget.current_url|default:'' }}"
           class="mbt-upload-url vTextField" data-url-input="1" placeholder="https://…">
  </div>

  <div class="mbt-r2-banner" data-r2-status="idle" hidden>
    <div class="mbt-r2-banner-main">
      <span class="mbt-r2-banner-icon" aria-hidden="true"></span>
      <div class="mbt-r2-banner-text-wrap">
        <span class="mbt-r2-banner-title"></span>
        <span class="mbt-r2-banner-detail"></span>
      </div>
    </div>
    <div class="mbt-r2-progress-wrap" hidden>
      <div class="mbt-r2-progress-bar" style="width: 0%;"></div>
    </div>
  </div>
</div>
