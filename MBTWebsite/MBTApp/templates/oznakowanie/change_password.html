{% load i18n %}
<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <title>{% trans "Zmień hasło" %} | MBT</title>
    <link rel="stylesheet" href="/static/css/mbt-override.css?v=20260830-blog-date">
    <style>
        body { background: #f5f5f7; margin: 0; padding: 2rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .ozn-wrap { max-width: 720px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1d1d1f; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn-primary { background: #FF6B35; color: white; padding: 0.85rem 2rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; width: 100%; }
        .btn-primary:hover { background: #e85a25; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; }
        .info-msg { background: #dbeafe; color: #1e40af; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; }
    </style>
</head>
<body>
    <div class="ozn-wrap">
        <h1 style="margin-top:0">{% trans "Zmień hasło" %}</h1>

        {% if must_change %}
            <div class="info-msg">{% trans "Pierwsze logowanie — ustaw swoje hasło." %}</div>
        {% endif %}

        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="new_password">{% trans "Nowe hasło" %} ({% trans "min. 8 znaków" %})</label>
                <input type="password" id="new_password" name="new_password" required minlength="8" autofocus>
            </div>
            <div class="form-group">
                <label for="new_password2">{% trans "Powtórz hasło" %}</label>
                <input type="password" id="new_password2" name="new_password2" required minlength="8">
            </div>
            <button type="submit" class="btn-primary">{% trans "Zapisz hasło" %}</button>
        </form>
    </div>
</body>
</html>
