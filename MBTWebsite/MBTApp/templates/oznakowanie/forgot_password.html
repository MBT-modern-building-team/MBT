{% load i18n %}
<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <title>{% trans "Zapomniałem hasła" %} | MBT</title>
    <link rel="stylesheet" href="/static/css/mbt-override.css?v=20260830-blog-date">
    <style>
        body { background: #f5f5f7; margin: 0; padding: 2rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .ozn-wrap { max-width: 720px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn-primary { background: #FF6B35; color: white; padding: 0.85rem 2rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; width: 100%; }
    </style>
</head>
<body>
    <div class="ozn-wrap">
        <h1 style="margin-top:0">{% trans "Zapomniałeś hasła?" %}</h1>
        <p style="color:#6e6e73">{% trans "Podaj email — administrator zresetuje hasło i prześle tymczasowe." %}</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">{% trans "Email" %}</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <button type="submit" class="btn-primary">{% trans "Wyślij prośbę" %}</button>
        </form>
        <p style="margin-top:1.5rem; font-size:0.9rem; text-align:center;">
            <a href="{% url 'oznakowanie_login' %}">← {% trans "Powrót do logowania" %}</a>
        </p>
    </div>
</body>
</html>
