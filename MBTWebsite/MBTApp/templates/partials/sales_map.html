{% load i18n %}
{% load static %}
<div class="sales-map-container mt-5 mb-5">
    <div class="row align-items-center">
        <div class="col-lg-7 text-center">
            <h3 class="text-white mb-3" style="font-weight: 700; letter-spacing: -0.3px;">{% trans "Znajdź opiekuna dla swojego regionu" %}</h3>
            
            <!-- Inteligentna wyszukiwarka miejscowości / opiekuna -->
            <div class="mbt-sales-search-box mb-4 mx-auto text-start" style="max-width: 620px;">
                <label for="sales-search-input" class="text-white-50 small mb-2 d-flex align-items-center justify-content-between" style="font-size: 13px;">
                    <span>
                        <i class="ri-search-2-line me-1" style="color: #7886FF;"></i>
                        {% trans "Wpisz swoją miejscowość, a my dobierzemy odpowiednią osobę:" %}
                    </span>
                    <span class="badge" style="background: rgba(43, 63, 214, 0.25); color: #9cb1ff; font-weight: 500; font-size: 11px;">Polska</span>
                </label>
                <div class="input-group" style="box-shadow: 0 10px 30px rgba(0,0,0,0.35); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px); transition: border-color 0.2s ease, box-shadow 0.2s ease;">
                    <span class="input-group-text border-0 ps-3" style="background: transparent; color: #7886FF;">
                        <i class="ri-map-pin-line" style="font-size: 19px;"></i>
                    </span>
                    <input type="text" id="sales-search-input" class="form-control border-0 text-white" placeholder="{% trans 'np. Przewrotne, Zabrze, Warszawa, Poznań...' %}" autocomplete="off" style="background: transparent; box-shadow: none; font-size: 14.5px; padding: 12px 6px; color: #fff;">
                    <button type="button" id="sales-search-clear" class="btn text-white-50 border-0 d-none" style="background: transparent; padding: 0 12px;" title="{% trans 'Wyczyść' %}">
                        <i class="ri-close-line" style="font-size: 18px;"></i>
                    </button>
                    <button type="button" id="sales-search-btn" class="btn border-0 px-3 px-md-4" style="background: #2b3fd6; color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 7px; transition: all 0.2s ease;">
                        <span id="sales-search-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        <i id="sales-search-icon" class="ri-search-line"></i>
                        <span id="sales-search-btn-text">{% trans "Szukaj" %}</span>
                    </button>
                </div>

                <!-- Przykładowe tagi / szybki wybór -->
                <div class="d-flex flex-wrap align-items-center gap-1 mt-2 text-start" style="font-size: 12px;">
                    <span class="text-white-50 me-1" style="font-size: 11.5px;">{% trans "Szybki test:" %}</span>
                    <button type="button" class="btn btn-sm sales-quick-tag" data-query="Przewrotne powiat rzeszowski" style="background: rgba(255,255,255,0.06); color: #9cb1ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 11.5px; padding: 2px 9px;">Przewrotne (pow. rzeszowski)</button>
                    <button type="button" class="btn btn-sm sales-quick-tag" data-query="Zabrze" style="background: rgba(255,255,255,0.06); color: #9cb1ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 11.5px; padding: 2px 9px;">Zabrze</button>
                    <button type="button" class="btn btn-sm sales-quick-tag" data-query="Warszawa" style="background: rgba(255,255,255,0.06); color: #9cb1ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 11.5px; padding: 2px 9px;">Warszawa</button>
                    <button type="button" class="btn btn-sm sales-quick-tag" data-query="Poznań" style="background: rgba(255,255,255,0.06); color: #9cb1ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 11.5px; padding: 2px 9px;">Poznań</button>
                    <button type="button" class="btn btn-sm sales-quick-tag" data-query="Gdańsk" style="background: rgba(255,255,255,0.06); color: #9cb1ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 11.5px; padding: 2px 9px;">Gdańsk</button>
                </div>

                <!-- Wynik wyszukiwania (komunikat / feedback alert) -->
                <div id="sales-search-feedback" class="mt-2 text-start p-2 px-3 rounded-3 d-none" style="font-size: 13px; line-height: 1.45; border-radius: 10px; transition: all 0.25s ease;"></div>
            </div>
            
            <div id="poland-map-wrapper" style="width: 100%; max-width: 620px; min-height: 480px; margin: 0 auto; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px; position: relative; box-sizing: border-box; backdrop-filter: blur(8px);">
                <svg id="poland-svg-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="650" height="600" style="width: 100%; height: auto; aspect-ratio: 650 / 600; min-height: 440px; display: block; margin: 0 auto;">

                        <filter id="map-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
                        </filter>
                    </defs>

                        <text x="421" y="121" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="11px" font-weight="600" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; user-select: none;">Warmińsko-Mazurskie</text>
                    </g>
                </svg>
                <!-- Tooltip for hover -->
                <div id="map-tooltip" style="position: absolute; display: none; background: rgba(25, 28, 32, 0.95); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; transform: translate(-50%, -125%); white-space: nowrap; z-index: 10; border: 1px solid rgba(43, 63, 214, 0.35); box-shadow: 0 8px 24px rgba(0,0,0,0.4);"></div>

            <!-- Interaktywne miniatury opiekunów pod mapą -->
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-3" style="max-width: 620px; margin: 0 auto;">
                <button type="button" class="btn btn-sm mbt-rep-chip" data-rep="Łukasz Liszka" style="background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 12px; padding: 5px 12px; transition: all 0.2s ease;">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #193175; margin-right: 6px;"></span>Północ: Łukasz Liszka
                </button>
                <button type="button" class="btn btn-sm mbt-rep-chip" data-rep="Agnieszka Grzelak" style="background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 12px; padding: 5px 12px; transition: all 0.2s ease;">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1a77a3; margin-right: 6px;"></span>Zachód: Agnieszka Grzelak
                </button>
                <button type="button" class="btn btn-sm mbt-rep-chip" data-rep="Karol Pinoczek" style="background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 12px; padding: 5px 12px; transition: all 0.2s ease;">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2b3fd6; margin-right: 6px;"></span>Południe: Karol Pinoczek
                </button>
                <button type="button" class="btn btn-sm mbt-rep-chip" data-rep="Marcin Kobryń" style="background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 12px; padding: 5px 12px; transition: all 0.2s ease;">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0d173d; margin-right: 6px; border: 1px solid rgba(255,255,255,0.3);"></span>Wschód: Marcin Kobryń
                </button>
                <button type="button" class="btn btn-sm mbt-rep-chip" data-rep="Jarosław Wawrzyk" style="background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 12px; padding: 5px 12px; transition: all 0.2s ease;">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4a68f5; margin-right: 6px;"></span>Południowy wschód: Jarosław Wawrzyk
                </button>

        <div class="col-lg-5 text-start mt-4 mt-lg-0">
            <!-- Wizytówka wybranego doradcy -->
            <div id="sales-rep-info" class="team-card bg-white p-4 rounded-4 d-none" style="box-shadow: 0 15px 40px rgba(0,0,0,0.2); transition: all 0.3s ease; border: 1px solid rgba(43, 63, 214, 0.1);">

                <div class="mb-3 p-2 px-3 rounded" style="background: #F6F8FF; border-left: 3px solid var(--theme-color, #2b3fd6); font-size: 12.5px; color: #4D4D4D;">
                    <span class="text-muted d-block small mb-1" style="font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Obsługiwany rejon:</span>
                    <strong id="sales-rep-coverage" style="color: #191C20;"></strong>
                </div>

                <div class="mb-2">
                    <a id="sales-rep-phone-btn" href="#" class="btn style2 w-100" style="font-size: 18px; padding: 12px 10px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <i class="ri-phone-fill me-1"></i> <span id="sales-rep-phone"></span>
                    </a>
                </div>
                <div class="text-center mt-2">
                    <a id="sales-rep-email-btn" href="#" class="text-body text-decoration-none" style="font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                        <i class="ri-mail-line" style="color: var(--theme-color, #2b3fd6);"></i> <span id="sales-rep-email"></span>
                    </a>
                </div>
            </div>

            <!-- Stan początkowy przed wyborem -->
            <div id="sales-rep-placeholder" class="text-white text-center p-4" style="background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.2); border-radius: 20px; backdrop-filter: blur(8px);">
                <div style="width: 52px; height: 52px; background: rgba(43, 63, 214, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; color: #7886FF;">
                    <i class="ri-map-pin-user-line" style="font-size: 26px;"></i>
                </div>
                <h4 class="text-white mb-2" style="font-size: 19px; font-weight: 600;">{% trans "Wybierz województwo" %}</h4>
                <p class="text-white-50 mb-0" style="font-size: 14px; max-width: 320px; margin: 0 auto;">{% trans "Kliknij na mapie swój region, aby zobaczyć bezpośredni kontakt do opiekuna Twojego regionu." %}</p>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var repCoverage = {
        "Łukasz Liszka": "woj. zachodniopomorskie, pomorskie, kujawsko-pomorskie",
        "Agnieszka Grzelak": "woj. dolnośląskie, wielkopolskie, lubuskie",
        "Karol Pinoczek": "woj. śląskie, opolskie, łódzkie",
        "Marcin Kobryń": "woj. mazowieckie, warmińsko-mazurskie, podlaskie",
        "Jarosław Wawrzyk": "woj. małopolskie, podkarpackie, świętokrzyskie, lubelskie"
    };

    var salesRepsData = {
        "Łukasz Liszka": {
            "name": "Łukasz Liszka",
            "position": "Manager ds. handlowych / Business Development Manager",
            "phone": "+48 881 202 306",
            "phone_href": "tel:+48881202306",
            "email": "l.liszka@mbt.pl",
            "photo": ""
        },
        "Agnieszka Grzelak": {
            "name": "Agnieszka Grzelak",
            "position": "Dział Handlowy",
            "phone": "881 202 233",
            "phone_href": "tel:881202233",
            "email": "a.grzelak@mbt.pl",
            "photo": ""
        },
        "Karol Pinoczek": {
            "name": "Karol Pinoczek",
            "position": "Dział Handlowy",
            "phone": "881 202 784",
            "phone_href": "tel:881202784",
            "email": "k.pinoczek@mbt.pl",
            "photo": "/static/img/mbt/O-nas-Karol-Pinoczek-scaled-e1769718455199-b48516a2.jpg"
        },
        "Marcin Kobryń": {
            "name": "Marcin Kobryń",
            "position": "Dział Handlowy",
            "phone": "881 202 615",
            "phone_href": "tel:881202615",
            "email": "m.kobryn@mbt.pl",
            "photo": ""
        },
        "Jarosław Wawrzyk": {
            "name": "Jarosław Wawrzyk",
            "position": "Dział Handlowy",
            "phone": "881 202 167",
            "phone_href": "tel:881202167",
            "email": "j.wawrzyk@mbt.pl",
            "photo": ""
        }
    };

    {% for rep in sales_reps %}
    salesRepsData["{{ rep.name|escapejs }}"] = {
        "name": "{{ rep.name|escapejs }}",
        "position": "{{ rep.position|escapejs }}",
        "phone": "{{ rep.phone|escapejs }}",
        "phone_href": "tel:{{ rep.phone|cut:' '|escapejs }}",
        "email": "{{ rep.email|escapejs }}",
        "photo": "{{ rep.photo|default:''|escapejs }}"
    };
    {% endfor %}

    function initSalesMap() {
        var paths = document.querySelectorAll('.mbt-region');
        var tooltip = document.getElementById('map-tooltip');
        var wrapper = document.getElementById('poland-map-wrapper');
        var chips = document.querySelectorAll('.mbt-rep-chip');
        var selectedRep = null;
        var selectedVoivodeshipSlug = null;

        var searchInput = document.getElementById('sales-search-input');
        var searchBtn = document.getElementById('sales-search-btn');
        var searchClear = document.getElementById('sales-search-clear');
        var searchSpinner = document.getElementById('sales-search-spinner');
        var searchIcon = document.getElementById('sales-search-icon');
        var searchFeedback = document.getElementById('sales-search-feedback');
        var quickTags = document.querySelectorAll('.sales-quick-tag');

        function showFeedback(htmlContent, type) {
            if (!searchFeedback) return;
            searchFeedback.classList.remove('d-none');
            if (type === 'success') {
                searchFeedback.style.background = 'rgba(43, 63, 214, 0.22)';
                searchFeedback.style.border = '1px solid rgba(120, 134, 255, 0.5)';
                searchFeedback.style.color = '#e0e7ff';
                searchFeedback.innerHTML = '<div class="d-flex align-items-center gap-2"><i class="ri-checkbox-circle-fill" style="color: #4ade80; font-size: 16px;"></i> <div>' + htmlContent + '</div></div>';
            } else {
                searchFeedback.style.background = 'rgba(234, 179, 8, 0.16)';
                searchFeedback.style.border = '1px solid rgba(234, 179, 8, 0.45)';
                searchFeedback.style.color = '#fef08a';
                searchFeedback.innerHTML = '<div class="d-flex align-items-center gap-2"><i class="ri-information-line" style="color: #facc15; font-size: 16px;"></i> <div>' + htmlContent + '</div></div>';
            }
        }

        function hideFeedback() {
            if (searchFeedback) searchFeedback.classList.add('d-none');
        }

        function selectRep(repName, regionName, specificVoivSlug) {
            selectedRep = repName;
            if (specificVoivSlug) {
                selectedVoivodeshipSlug = specificVoivSlug.toLowerCase();
            } else if (regionName) {
                selectedVoivodeshipSlug = regionName.toLowerCase();
            }
            var rep = salesRepsData[repName];
            if (!rep) return;

            var targetRegionId = selectedVoivodeshipSlug ? 'region-' + selectedVoivodeshipSlug : null;

            // Zaktualizuj stan zaznaczenia na ścieżkach
            paths.forEach(function(p) {
                if (p.getAttribute('data-rep') === repName) {
                    p.style.opacity = '1';
                    if (targetRegionId && p.id === targetRegionId) {
                        p.style.stroke = '#ffe066';
                        p.style.strokeWidth = '3px';
                        p.style.filter = 'brightness(1.35) drop-shadow(0 0 8px rgba(255, 224, 102, 0.8))';
                    } else {
                        p.style.stroke = '#ffffff';
                        p.style.strokeWidth = '2px';
                        p.style.filter = 'brightness(1.2)';
                    }
                } else {
                    p.style.opacity = '0.4';
                    p.style.stroke = '#ffffff';
                    p.style.strokeWidth = '1.4px';
                    p.style.filter = 'none';
                }
            });

            // Zaktualizuj chips pod mapą
            chips.forEach(function(c) {
                if (c.getAttribute('data-rep') === repName) {
                    c.style.background = 'rgba(43, 63, 214, 0.4)';
                    c.style.borderColor = 'var(--theme-color, #2b3fd6)';
                } else {
                    c.style.background = 'rgba(255,255,255,0.07)';
                    c.style.borderColor = 'rgba(255,255,255,0.15)';
                }
            });

            // Wypełnij dane wizytówki
            var badgeText = regionName ? 'Województwo ' + regionName : 'Region';
            document.getElementById('sales-rep-region-badge').innerText = badgeText;
            document.getElementById('sales-rep-name').innerText = rep.name;
            document.getElementById('sales-rep-position').innerText = rep.position;
            document.getElementById('sales-rep-coverage').innerText = repCoverage[repName] || '';

            if (rep.phone) {
                document.getElementById('sales-rep-phone').innerText = rep.phone;
                document.getElementById('sales-rep-phone-btn').href = rep.phone_href;
                document.getElementById('sales-rep-phone-btn').parentElement.classList.remove('d-none');
            } else {
                document.getElementById('sales-rep-phone-btn').parentElement.classList.add('d-none');
            }

            document.getElementById('sales-rep-email').innerText = rep.email;
            document.getElementById('sales-rep-email-btn').href = 'mailto:' + rep.email;

            var photoWrap = document.getElementById('sales-rep-photo-wrap');
            var photoEl = document.getElementById('sales-rep-photo');
            if (rep.photo) {
                photoEl.src = rep.photo;
                photoWrap.classList.remove('d-none');
            } else {
                photoWrap.classList.add('d-none');
            }

            document.getElementById('sales-rep-placeholder').classList.add('d-none');
            var card = document.getElementById('sales-rep-info');
            card.classList.remove('d-none');
            card.style.animation = 'none';
            card.offsetHeight; /* trigger reflow */
            card.style.animation = 'fadeIn 0.3s ease';
        }

        var voivRepMap = {
            'dolnośląskie': 'Agnieszka Grzelak',
            'wielkopolskie': 'Agnieszka Grzelak',
            'lubuskie': 'Agnieszka Grzelak',
            'śląskie': 'Karol Pinoczek',
            'opolskie': 'Karol Pinoczek',
            'łódzkie': 'Karol Pinoczek',
            'mazowieckie': 'Marcin Kobryń',
            'warmińsko-mazurskie': 'Marcin Kobryń',
            'podlaskie': 'Marcin Kobryń',
            'podkarpackie': 'Jarosław Wawrzyk',
            'małopolskie': 'Jarosław Wawrzyk',
            'świętokrzyskie': 'Jarosław Wawrzyk',
            'lubelskie': 'Jarosław Wawrzyk',
            'zachodniopomorskie': 'Łukasz Liszka',
            'pomorskie': 'Łukasz Liszka',
            'kujawsko-pomorskie': 'Łukasz Liszka'
        };

        var voivNamesMap = {
            'dolnośląskie': 'Dolnośląskie',
            'kujawsko-pomorskie': 'Kujawsko-Pomorskie',
            'lubelskie': 'Lubelskie',
            'lubuskie': 'Lubuskie',
            'łódzkie': 'Łódzkie',
            'małopolskie': 'Małopolskie',
            'mazowieckie': 'Mazowieckie',
            'opolskie': 'Opolskie',
            'podkarpackie': 'Podkarpackie',
            'podlaskie': 'Podlaskie',
            'pomorskie': 'Pomorskie',
            'śląskie': 'Śląskie',
            'świętokrzyskie': 'Świętokrzyskie',
            'warmińsko-mazurskie': 'Warmińsko-Mazurskie',
            'wielkopolskie': 'Wielkopolskie',
            'zachodniopomorskie': 'Zachodniopomorskie'
        };

        function matchVoivFromText(txt) {
            if (!txt) return null;
            var t = txt.toLowerCase().replace(/[\-_,./]+/g, ' ');
            var stems = [
                ['kujawsko pomorsk', 'kujawsko-pomorskie'],
                ['kujawsk', 'kujawsko-pomorskie'],
                ['kujaw', 'kujawsko-pomorskie'],
                ['zachodniopomorsk', 'zachodniopomorskie'],
                ['zachodnio pomorsk', 'zachodniopomorskie'],
                ['warmińsko mazursk', 'warmińsko-mazurskie'],
                ['warminsko mazursk', 'warmińsko-mazurskie'],
                ['warmińsk', 'warmińsko-mazurskie'],
                ['warmia', 'warmińsko-mazurskie'],
                ['mazur', 'warmińsko-mazurskie'],
                ['dolnośląsk', 'dolnośląskie'],
                ['dolnoslask', 'dolnośląskie'],
                ['wielkopolsk', 'wielkopolskie'],
                ['świętokrzysk', 'świętokrzyskie'],
                ['swietokrzysk', 'świętokrzyskie'],
                ['podkarpack', 'podkarpackie'],
                ['małopolsk', 'małopolskie'],
                ['malopolsk', 'małopolskie'],
                ['mazowieck', 'mazowieckie'],
                ['mazowsz', 'mazowieckie'],
                ['podlask', 'podlaskie'],
                ['lubelsk', 'lubelskie'],
                ['lubusk', 'lubuskie'],
                ['opolsk', 'opolskie'],
                ['pomorsk', 'pomorskie'],
                ['śląsk', 'śląskie'],
                ['slask', 'śląskie'],
                ['łódzk', 'łódzkie'],
                ['lodzk', 'łódzkie']
            ];
            for (var i = 0; i < stems.length; i++) {
                if (t.indexOf(stems[i][0]) !== -1) {
                    return stems[i][1];
                }
            }
            return null;
        }

        function fallbackClientGeocode(query, defaultMsg) {
            var url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=1';
            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (searchBtn) searchBtn.disabled = false;
                    if (searchSpinner) searchSpinner.classList.add('d-none');
                    if (searchIcon) searchIcon.classList.remove('d-none');

                    if (data && data.features && data.features.length > 0) {
                        var p = data.features[0].properties;
                        var fullText = (p.state || '') + ' ' + (p.county || '') + ' ' + (p.country || '') + ' ' + (p.name || '');
                        var voivSlug = matchVoivFromText(fullText);
                        if (voivSlug && voivRepMap[voivSlug]) {
                            var repName = voivRepMap[voivSlug];
                            var voivName = voivNamesMap[voivSlug] || voivSlug;
                            var placeTitle = p.name || p.city || query;
                            var msg = 'Lokalizacja: <strong>' + placeTitle + '</strong> (woj. ' + voivName + ') &mdash; Twój dedykowany doradca: <strong style="color: #fff;">' + repName + '</strong>';
                            showFeedback(msg, 'success');
                            selectRep(repName, voivName, voivSlug);
                            return;
                        }
                    }
                    showFeedback(defaultMsg || 'Nie udało się jednoznacznie zlokalizować miejscowości "' + query + '". Wybierz swoje województwo na mapie poniżej.', 'warning');
                })
                .catch(function() {
                    if (searchBtn) searchBtn.disabled = false;
                    if (searchSpinner) searchSpinner.classList.add('d-none');
                    if (searchIcon) searchIcon.classList.remove('d-none');
                    showFeedback(defaultMsg || 'Nie udało się jednoznacznie zlokalizować miejscowości "' + query + '". Wybierz swoje województwo na mapie poniżej.', 'warning');
                });
        }

        function doSearch(query) {
            if (!query || !query.trim()) {
                showFeedback('Wpisz nazwę miejscowości lub powiatu.', 'warning');
                return;
            }
            query = query.trim();

            if (searchBtn) searchBtn.disabled = true;
            if (searchSpinner) searchSpinner.classList.remove('d-none');
            if (searchIcon) searchIcon.classList.add('d-none');
            hideFeedback();

            var apiUrl = "{% url 'lookup_sales_rep' %}?q=" + encodeURIComponent(query);

            fetch(apiUrl)
                .then(function(res) {
                    if (!res.ok) throw new Error('Błąd serwera');
                    return res.json();
                })
                .then(function(data) {
                    if (data.success && data.rep) {
                        if (searchBtn) searchBtn.disabled = false;
                        if (searchSpinner) searchSpinner.classList.add('d-none');
                        if (searchIcon) searchIcon.classList.remove('d-none');

                        var locationTitle = data.place || query;
                        var msg = 'Lokalizacja: <strong>' + locationTitle + '</strong> (woj. ' + data.voivodeship + ') &mdash; Twój dedykowany doradca: <strong style="color: #fff;">' + data.rep.name + '</strong>';
                        showFeedback(msg, 'success');

                        selectRep(data.rep.name, data.voivodeship, data.voivodeship_slug);

                        if (window.innerWidth < 992) {
                            var card = document.getElementById('sales-rep-info');
                            if (card) {
                                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    } else {
                        fallbackClientGeocode(query, data.error);
                    }
                })
                .catch(function(err) {
                    fallbackClientGeocode(query, null);
                });
        }

        // Obsługa wyszukiwarki tekstowej
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                if (searchInput.value.trim().length > 0) {
                    if (searchClear) searchClear.classList.remove('d-none');
                } else {
                    if (searchClear) searchClear.classList.add('d-none');
                    hideFeedback();
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doSearch(searchInput.value);
                }
            });
        }

        if (searchClear && searchInput) {
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                searchClear.classList.add('d-none');
                hideFeedback();
                searchInput.focus();
            });
        }

        if (searchBtn && searchInput) {
            searchBtn.addEventListener('click', function() {
                doSearch(searchInput.value);
            });
        }

        quickTags.forEach(function(tag) {
            tag.addEventListener('click', function() {
                var q = tag.getAttribute('data-query');
                if (searchInput) {
                    searchInput.value = q;
                    if (searchClear) searchClear.classList.remove('d-none');
                }
                doSearch(q);
            });
        });

        // Event listenery dla województw na mapie SVG
        paths.forEach(function(path) {
            var repName = path.getAttribute('data-rep');
            var regionName = path.getAttribute('data-name');

            path.addEventListener('mouseenter', function(e) {
                paths.forEach(function(p) {
                    if (p.getAttribute('data-rep') === repName) {
                        p.style.opacity = '1';
                        p.style.filter = 'brightness(1.25)';
                    } else {
                        p.style.opacity = '0.35';
                        p.style.filter = 'none';
                    }
                });

                if (tooltip) {
                    tooltip.innerHTML = '<strong style="color: #fff; font-size: 13px;">' + regionName + '</strong><div style="color: #9cb1ff; font-size: 12px; margin-top: 2px;">Opiekun: ' + repName + '</div>';
                    tooltip.style.display = 'block';
                }
            });

            path.addEventListener('mousemove', function(e) {
                if (tooltip && wrapper) {
                    var rect = wrapper.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    tooltip.style.left = x + 'px';
                    tooltip.style.top = y + 'px';
                }
            });

            path.addEventListener('mouseleave', function() {
                if (selectedRep) {
                    selectRep(selectedRep, null, selectedVoivodeshipSlug);
                } else {
                    paths.forEach(function(p) {
                        p.style.opacity = '1';
                        p.style.filter = 'none';
                    });
                }
                if (tooltip) tooltip.style.display = 'none';
            });

            path.addEventListener('click', function() {
                var slug = path.id.replace('region-', '');
                selectRep(repName, regionName, slug);
                if (searchInput) {
                    searchInput.value = regionName;
                    if (searchClear) searchClear.classList.remove('d-none');
                }
                hideFeedback();
            });
        });

        // Event listenery dla przycisków szybkiego wyboru pod mapą
        chips.forEach(function(chip) {
            var repName = chip.getAttribute('data-rep');
            chip.addEventListener('click', function() {
                selectRep(repName);
                hideFeedback();
            });
            chip.addEventListener('mouseenter', function() {
                paths.forEach(function(p) {
                    if (p.getAttribute('data-rep') === repName) {
                        p.style.opacity = '1';
                        p.style.filter = 'brightness(1.25)';
                    } else {
                        p.style.opacity = '0.35';
                    }
                });
            });
            chip.addEventListener('mouseleave', function() {
                if (selectedRep) {
                    selectRep(selectedRep, null, selectedVoivodeshipSlug);
                } else {
                    paths.forEach(function(p) {
                        p.style.opacity = '1';
                        p.style.filter = 'none';
                    });
                }
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSalesMap);
    } else {
        initSalesMap();
    }
})();
</script>
