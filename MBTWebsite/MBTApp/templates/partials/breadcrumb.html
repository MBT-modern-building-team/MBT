{% load i18n %}
<div class="breadcumb-wrapper" style="position: relative; overflow: hidden; background: none;">
    <img src="{{ photos.bg_breadcrumb }}" fetchpriority="high" alt="Background" width="1920" height="400" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <div class="section-animation-shape1-1 shape-mockup animation-infinite" data-top="0" data-bg-src="/static/img/shape/global-line-shape1.png">
    </div>
    <!-- bg animated image/ -->   
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcumb-content">
                    <h1 class="breadcumb-title">{{ title }}</h1>
                    <ul class="breadcumb-menu">
                        <li><a href="{% url 'index' %}"><i class="ri-home-4-fill"></i> {% trans 'HOME' %}</a></li>
                        <li class="active">{{ subTitle }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
