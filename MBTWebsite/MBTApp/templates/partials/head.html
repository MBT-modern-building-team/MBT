{% load i18n %}
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>{% if title %}{{ title }} - {% endif %}MBT Modern Building Team - {% trans 'Generalny Wykonawca Hal i Obiektów Przemysłowych' %}</title>
    <meta name="description" content="{% trans 'Szukasz solidnego generalnego wykonawcy? MBT to terminowa budowa hal, magazynów i obiektów przemysłowych pod klucz. Sprawdź nasze realizacje i ofertę!' %}">
    <meta name="keywords" content="MBT, {% trans 'generalny wykonawca' %}, {% trans 'hale magazynowe' %}, {% trans 'hale produkcyjne' %}, {% trans 'obiekty przemysłowe' %}, {% trans 'budowa pod klucz' %}">
    <meta name="robots" content="INDEX,FOLLOW">
    
    <!-- Open Graph / SEO -->
    <meta property="og:title" content="{% if title %}{{ title }} - {% endif %}MBT Modern Building Team">
    <meta property="og:description" content="{% trans 'Szukasz solidnego generalnego wykonawcy? MBT to terminowa budowa hal, magazynów i obiektów przemysłowych pod klucz. Sprawdź nasze realizacje i ofertę!' %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    {% if photos and photos.home_hero_bg %}
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ photos.home_hero_bg }}">
    {% else %}
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}/static/img/favicons/favicon.png">
    {% endif %}

    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Favicon (z mbt.pl) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicons/favicon.png">
    <meta name="msapplication-TileColor" content="#191C20">
    <meta name="theme-color" content="#191C20">

    <!--==============================
    Preloads for LCP
    ============================== -->
    {% if photos and photos.home_hero_bg %}
    <link rel="preload" as="image" href="{{ photos.home_hero_bg }}" fetchpriority="high">
    {% endif %}
    <link rel="preload" as="image" href="/static/img/hero/hero_bg_mask_3_1.webp">

    <!--==============================
	Fonts
	============================== -->
    <!-- Technor (headings) - Fontshare -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=technor@300,400,500,600,700,800&display=swap" as="style">
    <link href="https://api.fontshare.com/v2/css?f[]=technor@300,400,500,600,700,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://api.fontshare.com/v2/css?f[]=technor@300,400,500,600,700,800&display=swap" rel="stylesheet"></noscript>
    
    <!-- Noto Sans (body) - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"></noscript>

    <!--==============================
	All CSS File
    ============================== -->
    <!-- Bootstrap -->
    <link rel="preload" href="/static/css/bootstrap.min.css" as="style">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    
    <!-- Fontawesome Icon -->
    <link rel="preload" href="/static/fonts/remixicon.min.css?v=20260820-swap" as="style">
    <link rel="stylesheet" href="/static/fonts/remixicon.min.css?v=20260820-swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/fonts/remixicon.min.css?v=20260820-swap"></noscript>
    
    <!-- Magnific Popup -->
    <link rel="preload" href="/static/css/magnific-popup.min.css" as="style">
    <link rel="stylesheet" href="/static/css/magnific-popup.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/css/magnific-popup.min.css"></noscript>
    
    <!-- Slick Slider -->
    <link rel="preload" href="/static/css/slick.min.css" as="style">
    <link rel="stylesheet" href="/static/css/slick.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/css/slick.min.css"></noscript>
    
    <!-- Nice Select -->
    <link rel="preload" href="/static/css/nice-select.min.css" as="style">
    <link rel="stylesheet" href="/static/css/nice-select.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/css/nice-select.min.css"></noscript>
    
    <!-- Theme Custom CSS -->
    <link rel="preload" href="/static/css/style.min.css" as="style">
    <link rel="stylesheet" href="/static/css/style.min.css">
    
    <!-- MBT Override (rebrand to mbt.pl design language) -->
    <link rel="preload" href="/static/css/mbt-override.min.css?v=20260830-blog-date-2" as="style">
    <link rel="stylesheet" href="/static/css/mbt-override.min.css?v=20260830-blog-date-2">
</head>
